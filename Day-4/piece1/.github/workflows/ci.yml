name: CI

on:
  push:
    branches:
      - "**"

  pull_request:
    branches:
      - main

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore QuotesApi.Tests.Integration/QuotesApi.Tests.Integration.csproj

      - name: Build
        run: dotnet build QuotesApi.Tests.Integration/QuotesApi.Tests.Integration.csproj --no-restore

      - name: Test with coverage
        run: >
          dotnet test
          QuotesApi.Tests.Integration/QuotesApi.Tests.Integration.csproj
          --no-build
          --logger "trx;LogFileName=test-results.trx"
          --collect:"XPlat Code Coverage"

      - name: Check code coverage
        shell: pwsh
        run: |
          $coverageFile = Get-ChildItem -Path . -Recurse -Filter coverage.cobertura.xml |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1

          if (-not $coverageFile) {
            Write-Error "Coverage file was not found."
            exit 1
          }

          [xml]$coverage = Get-Content $coverageFile.FullName

          $lineRate = [double]$coverage.coverage.'line-rate'
          $coveragePercent = $lineRate * 100

          Write-Host "Line coverage: $([math]::Round($coveragePercent, 2))%"

          if ($coveragePercent -lt 70) {
            Write-Error "Code coverage is below the required 70%."
            exit 1
          }

          Write-Host "Code coverage requirement passed."

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/TestResults/*.trx"
          if-no-files-found: error

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage
          path: "**/TestResults/**/coverage.cobertura.xml"
          if-no-files-found: error